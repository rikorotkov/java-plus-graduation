server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  cloud:
    gateway:
      routes:
        - id: stat-server
          uri: lb://stats-server
          predicates:
            - Path=/hit/**,/stats/**

        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/admin/**,/users/**,/categories/**,/compilations/**,/events/**