server:
  port: 0

spring:
  application:
    name: main-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/main
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  sql:
    init:
      mode: always

stats:
  server:
    url: lb://stats-server